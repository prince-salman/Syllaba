name: Syllaba
options:
  bundleIdPrefix: xyz.syllaba
  deploymentTarget:
    iOS: "17.0"
packages:
  SyllabaIOS:
    path: .
targets:
  Syllaba:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: SyllabaIOS
        product: SyllabaApp
      - package: SyllabaIOS
        product: SyllabaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.syllaba.ios
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Syllaba
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
schemes:
  Syllaba:
    build:
      targets:
        Syllaba: all
    run:
      config: Debug
    archive:
      config: Release
